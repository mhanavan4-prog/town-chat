name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install deps
        run: npm install
      - name: Build client bundle
        # public/client.js is generated and no longer committed — build it here
        # so the syntax check, smoke test and boot tests below have it.
        run: npm run build:client
      - name: Syntax check
        run: |
          node --check server.js
          node --check public/client.js
      - name: Lint (catches redeclare/dup/unreachable + undefined vars)
        run: npm run lint
      - name: Type-check (tsc on the @ts-check files)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install Chromium for smoke test
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test (boots client.js, catches load crashes)
        run: npm run test:smoke

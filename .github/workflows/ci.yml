name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install deps
        run: npm install
      - name: Build client bundle
        # public/client.js is generated and no longer committed — build it here
        # so the syntax check, smoke test and boot tests below have it.
        run: npm run build:client
      - name: Syntax check
        run: |
          node --check server.js
          node --check public/client.js
      - name: Lint (catches redeclare/dup/unreachable + undefined vars)
        run: npm run lint
      - name: Type-check (tsc on the @ts-check files)
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # Cache the Playwright browser binary so the smoke test doesn't re-download
      # Chromium (~120MB) on every run — that step was taking 20+ minutes. The
      # cache key is the installed Playwright version, so a version bump busts it.
      - name: Resolve Playwright version
        id: pw
        run: echo "v=$(node -e "console.log(require('playwright/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.v }}
      - name: Install Chromium + system deps (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # The runner image already carries nearly everything Chromium needs; this
      # tops it up from Ubuntu's mirrors. When those mirrors can't be reached
      # (it happens), try twice, five minutes at most each, then carry on: if a library really is missing, the
      # browser smoke test just below fails loudly, so nothing is hidden.
      - name: Install Chromium system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          for i in 1 2; do
            timeout 300 npx playwright install-deps chromium && exit 0
            echo "::warning::Ubuntu mirrors unreachable (try $i of 2)"; sleep 20
          done
          echo "::warning::Could not top up Chromium's system deps; going on with the runner image's own
      - name: Browser smoke test (boots client.js, catches load crashes)
        run: npm run test:smoke

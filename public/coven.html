<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coven — Thornreach</title>
<!--OG-->
<meta name="theme-color" content="#140f2b">
<link rel="icon" href="/icon-192.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg0:#130c22;--bg1:#0b0716;--bg2:#060410;--ink:#e9ddff;--mut:#a99bc4;--mut2:#8d80a8;--violet:#b98aff;--teal:#7ef0c3;--green:#9ee37d;--gold:#e8d9a8;--card:rgba(16,10,26,0.72);--line:rgba(185,138,255,0.18);--grad:linear-gradient(90deg,#a678f0,#5ee7c0)}
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);font-family:'Segoe UI',system-ui,Arial,sans-serif;line-height:1.55;min-height:100vh;background:radial-gradient(1100px 620px at 78% -5%,rgba(146,109,222,0.18),transparent 55%),radial-gradient(820px 520px at 6% 12%,rgba(94,231,192,0.07),transparent 60%),linear-gradient(180deg,var(--bg0) 0%,var(--bg1) 45%,var(--bg2) 100%);background-attachment:fixed}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:900px;margin:0 auto;padding:0 20px}
  .wordmark{font-family:'Cinzel Decorative','Cinzel',Georgia,serif;letter-spacing:3px;font-weight:900}
  .grad-text{background:linear-gradient(90deg,#c9a7ff 0%,#8de8c8 55%,#e8d9a8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{display:inline-block;font-weight:800;letter-spacing:.4px;cursor:pointer;border:none;border-radius:10px;padding:9px 16px;color:#0b0713;background:var(--grad);box-shadow:0 6px 22px rgba(130,90,230,0.32);transition:transform .14s ease;font-size:13px}
  .btn:hover{transform:translateY(-2px)}
  .btn.ghost{background:rgba(10,6,20,0.5);color:var(--ink);border:1px solid var(--line);box-shadow:none}
  header.nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);background:linear-gradient(180deg,rgba(11,7,22,0.86),rgba(11,7,22,0.55));border-bottom:1px solid rgba(185,138,255,0.12)}
  .nav .wrap{display:flex;align-items:center;gap:14px;height:62px;max-width:900px}
  .brand{display:flex;align-items:center;gap:10px}.brand .sigil{width:28px;height:28px}.brand .name{font-size:18px}
  .nav .right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .nav .right a.link{color:var(--mut);font-size:14px}.nav .right a.link:hover{color:var(--ink)}
  .hero{display:flex;align-items:center;gap:20px;padding:34px 0 10px;flex-wrap:wrap}
  .hero .sig{width:88px;height:88px;flex:0 0 auto;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:48px;background:radial-gradient(circle at 50% 38%,rgba(140,90,255,0.22),rgba(10,6,20,0.5) 72%);border:1px solid var(--line)}
  .hero h1{font-family:'Cinzel',serif;font-weight:600;font-size:clamp(26px,5vw,38px);margin:0;letter-spacing:0.5px}
  .hero .meta{color:var(--mut);font-size:13.5px;margin-top:4px}
  .hero .sp{margin-left:auto;display:flex;gap:10px}
  .badges{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 0}
  .badge{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--line);background:rgba(10,6,20,0.5);color:var(--mut)}
  .badge.gold{color:var(--gold);border-color:rgba(232,217,168,0.4)}
  .badge.good{color:var(--green);border-color:rgba(158,227,125,0.4)}
  .motd{margin:22px 0 0;padding:16px 18px;border-left:3px solid var(--violet);background:rgba(140,90,255,0.08);border-radius:0 12px 12px 0;color:#d8cced;font-family:Georgia,serif;font-style:italic}
  h2.sec{font-family:'Cinzel',serif;font-weight:600;font-size:15px;letter-spacing:1.5px;text-transform:uppercase;color:var(--violet);margin:30px 0 14px}
  .members{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding-bottom:70px}
  @media(max-width:700px){ .members{grid-template-columns:repeat(2,1fr)} }
  .mem{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px 10px;transition:transform .14s ease,border-color .14s ease;position:relative}
  .mem:hover{transform:translateY(-3px);border-color:rgba(185,138,255,0.45)}
  .mem .av{width:100%;height:84px;display:flex;align-items:flex-end;justify-content:center}
  .mem .av img{height:84px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,0.5))}
  .mem .mn{font-weight:800;color:#f1e9ff;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mem .ms{font-size:11.5px;color:var(--mut)}
  .mem .lead{position:absolute;top:8px;right:8px;font-size:9px;letter-spacing:0.5px;text-transform:uppercase;color:#0b0713;background:var(--grad);padding:2px 7px;border-radius:12px;font-weight:800}
  .mem .dot{position:absolute;top:10px;left:10px;width:9px;height:9px;border-radius:50%;background:#56607a}
  .mem .dot.on{background:#6fe0a0;box-shadow:0 0 8px rgba(111,224,160,0.7)}
  .loading,.nf{text-align:center;color:var(--mut2);padding:70px 0;font-style:italic}
  .nf .btn{margin-top:16px;font-style:normal}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);background:rgba(20,13,34,0.96);border:1px solid var(--line);color:var(--ink);padding:11px 20px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 10px 36px rgba(0,0,0,0.5);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:80}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="jsg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b98aff"/><stop offset="1" stop-color="#7ef0c3"/></linearGradient>
</defs></svg>
<header class="nav"><div class="wrap">
  <a class="brand" href="/">
    <svg class="sigil" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="none" stroke="url(#jsg)" stroke-width="4"/><path d="M50 6 L75.86 85.6 L8.15 36.4 L91.85 36.4 L24.14 85.6 Z" fill="none" stroke="url(#jsg)" stroke-width="4" stroke-linejoin="round"/></svg>
    <span class="wordmark name grad-text">THORNREACH</span>
  </a>
  <div class="right">
    <div id="siteSearch"></div>
    <a class="link" href="/covens">All covens</a>
    <a class="btn ghost" href="/play">Enter the Town</a>
  </div>
</div></header>

<main class="wrap">
  <div class="loading" id="loading">Reading the circle…</div>
  <div id="content" style="display:none">
    <div class="hero">
      <div class="sig" id="cSig">🌑</div>
      <div>
        <h1 id="cName">—</h1>
        <div class="meta" id="cMeta"></div>
        <div class="badges" id="cBadges"></div>
      </div>
      <div class="sp"><button class="btn ghost" id="shareBtn">🔗 Share</button></div>
    </div>
    <div class="motd" id="cMotd" style="display:none"></div>
    <h2 class="sec">The Circle</h2>
    <div class="members" id="members"></div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script>
(function(){
  "use strict";
  function esc(s){ return String(s==null?'':s).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];}); }
  var PORTRAIT=['char0.png','char1.png','char2.png?v=2','char3.png','char4.png?v=2','char5.png'];
  var id=''; var m=location.pathname.match(/^\/c\/([^\/?#]+)/); if(m){ try{ id=decodeURIComponent(m[1]); }catch(e){ id=m[1]; } }

  function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('show'); },1800); }
  document.getElementById('shareBtn').onclick=function(){
    var url=location.href, title=(document.getElementById('cName').textContent||'A coven')+' — Thornreach';
    if(navigator.share){ navigator.share({title:title,url:url}).catch(function(){}); return; }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(function(){ toast('Link copied!'); }, function(){ window.prompt('Copy this link:',url); }); return; }
    window.prompt('Copy this link:',url);
  };

  fetch('/api/coven?id='+encodeURIComponent(id)).then(function(r){ if(!r.ok) throw new Error('nf'); return r.json(); }).then(function(d){
    document.getElementById('loading').style.display='none';
    document.getElementById('content').style.display='block';
    document.getElementById('cSig').textContent=d.sigil||'🌑';
    document.getElementById('cName').textContent=d.name;
    document.getElementById('cMeta').textContent=d.members.length+' member'+(d.members.length===1?'':'s')+' · led by '+d.leader;
    var badges=[];
    if(d.weeklyRank) badges.push('<span class="badge gold">🏅 #'+d.weeklyRank+' this week'+(d.covenCount?(' of '+d.covenCount):'')+' · '+Number(d.weeklyPoints||0).toLocaleString()+' pts</span>');
    if(d.crowns) badges.push('<span class="badge gold">👑 '+d.crowns+' crown'+(d.crowns===1?'':'s')+'</span>');
    badges.push('<span class="badge '+(d.standing==='In good standing'?'good':'')+'">'+esc(d.standing)+'</span>');
    document.getElementById('cBadges').innerHTML=badges.join('');
    if(d.motd){ var mo=document.getElementById('cMotd'); mo.style.display='block'; mo.textContent='“'+d.motd+'”'; }
    document.getElementById('members').innerHTML=(d.members||[]).map(function(x){
      return '<a class="mem" href="/u/'+encodeURIComponent(x.name)+'">'+
        '<span class="dot'+(x.online?' on':'')+'" title="'+(x.online?'online':'offline')+'"></span>'+
        (x.leader?'<span class="lead">Leader</span>':'')+
        '<span class="av"><img src="/charselect/'+PORTRAIT[x.charId]+'" alt=""></span>'+
        '<span class="mn">'+esc(x.name)+'</span><span class="ms">Lv '+x.level+'</span></a>';
    }).join('');
    document.title=d.name+' — Thornreach';
  }).catch(function(){
    document.getElementById('loading').style.display='none';
    var c=document.getElementById('content'); c.style.display='block';
    c.innerHTML='<div class="nf">No such coven walks Thornreach.<br><a class="btn" href="/covens">All covens</a></div>';
  });
})();
</script>
<script src="/site-search.js" defer></script>
</body>
</html>

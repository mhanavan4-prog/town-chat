<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EXIF">
<meta name="theme-color" content="#0f1116">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>EXIF Inspector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Phone-first metadata app: sticky title bar, a scrolling stack of the photo
     + readout cards, and a sticky bottom action bar (Save clean · JSON · New). */
  :root {
    --bg:#0f1116; --raise:#171a22; --card:#1b1f29; --inset:#232834; --line:#2b313f;
    --fg:#eceef4; --muted:#949cb0; --faint:#626b80;
    --accent:#f2a93b; --accent-ink:#1a1304;
    --link:#5ac8d0; --good:#73d08a; --warn:#ff8f66; --warnbg:#3a241b;
    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --sans:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --r:16px;
    color-scheme:dark;
  }
  @media (prefers-color-scheme:light){ :root:not([data-theme="dark"]){
    --bg:#eef0f4; --raise:#ffffff; --card:#ffffff; --inset:#f1f3f7; --line:#e0e4ec;
    --fg:#171b22; --muted:#596173; --faint:#8a92a4;
    --accent:#b9760f; --accent-ink:#fff; --link:#0f7f88; --good:#2f9b50; --warn:#c6531f; --warnbg:#fbe9e0;
    color-scheme:light;
  }}
  :root[data-theme="light"]{
    --bg:#eef0f4; --raise:#ffffff; --card:#ffffff; --inset:#f1f3f7; --line:#e0e4ec;
    --fg:#171b22; --muted:#596173; --faint:#8a92a4;
    --accent:#b9760f; --accent-ink:#fff; --link:#0f7f88; --good:#2f9b50; --warn:#c6531f; --warnbg:#fbe9e0;
    color-scheme:light;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
    display:flex;flex-direction:column;min-height:100%}
  h1,h2,h3{margin:0;text-wrap:balance}
  a{color:var(--link)}
  button{font-family:inherit}

  /* side gutter helper */
  .gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

  /* ---- title bar ---- */
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
    background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line)}
  .top .in{display:flex;align-items:center;gap:10px;padding-block:12px;max-width:620px;margin:0 auto}
  .brand{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 9px var(--accent)}
  .brand b{color:var(--accent);font-weight:600}
  .top .sp{flex:1}
  .icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:transparent;
    color:var(--muted);cursor:pointer;font-size:15px;display:grid;place-items:center}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn:focus-visible,.pick:focus-visible,.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  main{flex:1;width:100%;max-width:620px;margin:0 auto;padding-block:18px 26px}

  /* ---- empty state / picker ---- */
  .pick{display:block;width:100%;border:0;cursor:pointer;color:inherit;text-align:center;
    background:linear-gradient(170deg,var(--raise),var(--card));border:1px solid var(--line);
    border-radius:22px;padding:40px 22px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
  .pick.over{border-color:var(--accent)}
  .pick .lens{width:66px;height:66px;margin:0 auto 16px;border-radius:50%;border:2px solid var(--accent);
    display:grid;place-items:center;color:var(--accent);font-size:28px;
    box-shadow:inset 0 0 0 5px color-mix(in srgb,var(--accent) 15%,transparent),0 0 24px color-mix(in srgb,var(--accent) 25%,transparent)}
  .pick h2{font-size:20px;font-weight:700}
  .pick .cta{display:inline-block;margin-top:16px;background:var(--accent);color:var(--accent-ink);
    font-weight:700;font-size:15px;border-radius:12px;padding:12px 22px}
  .pick .sub{margin:10px 0 0;color:var(--muted);font-size:13px}
  .privacy{margin-top:18px;font-size:12.5px;color:var(--faint);display:flex;gap:7px;justify-content:center;align-items:center}
  .privacy b{color:var(--good);font-weight:600}
  .caps{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .cap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
  .cap .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
  .cap .v{font-size:12px;color:var(--muted);margin-top:3px}

  /* ---- results ---- */
  #results[hidden]{display:none}
  .photo{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--inset);
    box-shadow:0 10px 30px rgba(0,0,0,.28)}
  .photo img{display:block;width:100%;max-height:300px;object-fit:contain;
    background:repeating-conic-gradient(var(--inset) 0 25%, color-mix(in srgb,var(--line) 55%,var(--inset)) 0 50%) 50%/20px 20px}
  .photo .meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:11px 13px;border-top:1px solid var(--line)}
  .photo .fname{font-family:var(--mono);font-size:12px;color:var(--fg);flex:1;min-width:0;word-break:break-all}
  .chip{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--inset);
    border:1px solid var(--line);border-radius:999px;padding:3px 9px;white-space:nowrap}

  .status{margin-top:14px;border-radius:var(--r);padding:14px 15px;display:flex;gap:12px;align-items:flex-start}
  .status.gps{background:var(--warnbg);border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line))}
  .status.clean{background:color-mix(in srgb,var(--good) 12%,var(--card));border:1px solid color-mix(in srgb,var(--good) 35%,var(--line))}
  .status .ic{font-size:19px;line-height:1.2}
  .status .t{font-size:14px;font-weight:600}
  .status.gps .t{color:var(--warn)} .status.clean .t{color:var(--good)}
  .status .d{font-size:12.5px;color:var(--muted);margin-top:3px;font-family:var(--mono);word-break:break-word}
  .status .d a{font-family:var(--mono)}

  .card{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .card > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;
    padding:14px 16px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
  .card > summary::-webkit-details-marker{display:none}
  .card > summary .cc{margin-left:auto;color:var(--faint);font-weight:400}
  .card > summary .chev{color:var(--faint);transition:transform .18s}
  .card[open] > summary .chev{transform:rotate(90deg)}
  .card .rows{padding:2px 16px 14px}
  .row{display:flex;gap:14px;justify-content:space-between;align-items:baseline;padding:8px 0;
    border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
  .row:last-child{border-bottom:0}
  .row .rk{color:var(--muted);font-size:13px;flex:0 0 auto}
  .row .rv{font-family:var(--mono);font-size:12.5px;text-align:right;min-width:0;word-break:break-word;font-variant-numeric:tabular-nums}
  .emptyc{padding:0 16px 16px;color:var(--faint);font-size:12.5px}
  .thumb{padding:0 16px 16px}
  .thumb img{border:1px solid var(--line);border-radius:10px;max-height:150px}

  .search{width:100%;font-family:var(--mono);font-size:12.5px;background:var(--inset);border:1px solid var(--line);
    color:var(--fg);border-radius:10px;padding:9px 11px;margin:0 0 4px}
  .search:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .grp{border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
  .grp > button{width:100%;text-align:left;background:transparent;border:0;cursor:pointer;color:var(--fg);
    font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;padding:10px 0;display:flex;gap:9px;align-items:center}
  .grp > button .seg{color:var(--accent);text-transform:uppercase}
  .grp > button .n{color:var(--faint)}
  .grp > button .chev{margin-left:auto;color:var(--faint);transition:transform .15s}
  .grp.closed > button .chev{transform:rotate(-90deg)}
  .kv{display:grid;grid-template-columns:minmax(96px,.85fr) 1.5fr;gap:8px 14px;padding:5px 0;
    border-top:1px dashed color-mix(in srgb,var(--line) 45%,transparent)}
  .kv .kk{font-family:var(--mono);font-size:11.5px;color:var(--link);word-break:break-word;min-width:0}
  .kv .vv{font-family:var(--mono);font-size:11.5px;color:var(--fg);word-break:break-word;white-space:pre-wrap;min-width:0}
  .grp.closed .kv,.grp.closed .nokv{display:none}

  .note{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;color:var(--faint);font-size:13px}

  /* ---- sticky action bar ---- */
  .bar{position:sticky;bottom:0;z-index:25;margin-top:auto;
    background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
    padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .bar .in{display:flex;gap:9px;max-width:620px;margin:0 auto;padding-top:10px}
  .act{flex:1;border:1px solid var(--line);background:var(--raise);color:var(--fg);
    border-radius:13px;padding:13px 10px;font-size:13.5px;font-weight:600;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
  .act .em{font-size:17px}
  .act .lb{font-size:11.5px}
  .act:active{transform:scale(.97)}
  .act.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .act[disabled]{opacity:.45;cursor:default}
  #bar[hidden]{display:none}

  /* ---- toast ---- */
  #toast{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;
    background:var(--raise);border:1px solid var(--line);color:var(--fg);
    border-radius:12px;padding:11px 16px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4);
    max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.show.hiding{opacity:0}

  .foot{color:var(--faint);font-size:11.5px;text-align:center;margin-top:22px;line-height:1.6}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div class="top">
  <div class="in gut">
    <span class="brand"><span class="dot"></span>EXIF&nbsp;<b>Inspector</b></span>
    <span class="sp"></span>
    <button class="icon-btn" id="themeBtn" title="Light / dark" aria-label="Toggle theme">◐</button>
  </div>
</div>

<main class="gut">
  <!-- EMPTY STATE -->
  <section id="intro">
    <button class="pick" id="pick" aria-label="Choose a photo">
      <span class="lens">◎</span>
      <h2>Inspect a photo</h2>
      <span class="cta">Choose a photo</span>
      <p class="sub">or drag one in / paste from clipboard</p>
      <span class="privacy">🔒 <span><b>Nothing leaves your phone.</b> Read on-device.</span></span>
    </button>
    <input type="file" id="file" accept="image/*" hidden>
    <div class="caps">
      <div class="cap"><div class="k">Camera</div><div class="v">Make, lens, settings</div></div>
      <div class="cap"><div class="k">Location</div><div class="v">GPS, with a warning</div></div>
      <div class="cap"><div class="k">Timestamps</div><div class="v">When it was shot</div></div>
      <div class="cap"><div class="k">Clean copy</div><div class="v">Strip &amp; save, metadata-free</div></div>
    </div>
    <div class="foot">Reads EXIF · GPS · IPTC · XMP · ICC &nbsp;·&nbsp; nothing is uploaded</div>
  </section>

  <!-- RESULTS -->
  <section id="results" hidden>
    <div class="photo"><img id="pv" alt="Selected photo"><div class="meta"><span class="fname" id="fname"></span><span id="chips"></span></div></div>
    <div id="statusBox"></div>
    <div id="cards"></div>

    <details class="card" id="rawCard">
      <summary>All metadata <span class="cc" id="rawCount"></span><span class="chev">›</span></summary>
      <div class="rows">
        <input class="search" id="search" placeholder="filter tags…" aria-label="Filter tags">
        <div id="rawBody"></div>
      </div>
    </details>
    <div class="foot" id="resFoot"></div>
  </section>
</main>

<div class="bar" id="bar" hidden>
  <div class="in gut">
    <button class="act primary" id="saveBtn"><span class="em">🧼</span><span class="lb">Save clean</span></button>
    <button class="act" id="jsonBtn"><span class="em">{ }</span><span class="lb">Copy JSON</span></button>
    <button class="act" id="newBtn"><span class="em">↺</span><span class="lb">New photo</span></button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

      ['Altitude', num(pick(flat,['GPSAltitude']))?round(pick(flat,['GPSAltitude']),1)+' m':null],
      ['Direction', num(pick(flat,['GPSImgDirection']))?round(pick(flat,['GPSImgDirection']),1)+'°':null]]:[];
    var colorPairs=[['Dimensions', dim?(dim.w+' × '+dim.h+'  ('+mp+' MP)'):null],['Color space',pick(flat,['ColorSpace'])],
      ['ICC profile', pick(icc,['ProfileDescription','desc'])||pick(flat,['ProfileDescription'])],
      ['Resolution', num(pick(flat,['XResolution']))?(round(pick(flat,['XResolution']))+' dpi'):null]];
    var rightsPairs=[['Artist', pick(flat,['Artist'])||pick(xmp,['creator','Creator'])||pick(iptc,['Byline'])],
      ['Copyright', pick(flat,['Copyright'])||pick(xmp,['rights'])],['Title', pick(xmp,['title'])||pick(iptc,['ObjectName','Headline'])],
      ['Description', pick(flat,['ImageDescription'])||pick(xmp,['description'])||pick(iptc,['Caption'])],
      ['Keywords', [].concat(pick(xmp,['subject'])||[],pick(iptc,['Keywords'])||[]).filter(Boolean).join(', ')||null]];
    var thumbExtra = thumb?'<div class="thumb"><img src="'+thumb+'" alt="Embedded thumbnail"></div>':'';

    var html='';
    html += card('Camera & exposure', camPairs, '', true);
    if (hasGPS) html += card('Location', locPairs, '', true);
    html += card('Timestamps', timePairs);
    html += card('Image & color', colorPairs);
    html += card('Authorship', rightsPairs);
    if (thumb) html += card('Embedded thumbnail', [], thumbExtra);
    if (!html) html = '<div class="note">No EXIF, GPS, IPTC or XMP metadata — likely a screenshot, an export, or stripped on upload. The details above come from the pixels themselves.</div>';
    $('cards').innerHTML = html;

    buildRaw(seg, dim, file);
    currentJSON = buildJSON(file, dim, seg, gps, hasGPS);
    $('resFoot').textContent = hasGPS ? 'Tip: “Save clean” writes a copy with all of this removed.' : '';
  }

  function rat(v){ try{ var f=parseFloat(v); return isFinite(f)?f:null; }catch(e){ return null; } }

  /* raw dump */
  function flatten(o,prefix,out){ out=out||{}; for(var k in o){ var v=o[k]; if(v instanceof Date)v=v.toISOString();
    if(v&&typeof v==='object'&&!Array.isArray(v)&&!(v instanceof Uint8Array)) flatten(v,(prefix?prefix+'.':'')+k,out);
    else { if(Array.isArray(v)) v=v.length>24?'['+v.length+' values]':v.join(', '); if(v instanceof Uint8Array) v='['+v.length+' bytes]'; out[(prefix?prefix+'.':'')+k]=v; } } return out; }
  var SEG={ifd0:'IFD0',image:'Image',exif:'EXIF',gps:'GPS',interop:'Interop',ifd1:'Thumbnail',thumbnail:'Thumbnail',xmp:'XMP',iptc:'IPTC',icc:'ICC',jfif:'JFIF',ihdr:'PNG header'};
  var rawGroups=[];
  function buildRaw(seg,dim,file){
    rawGroups=[{seg:'File',kv:{'File name':file.name,'Type':file.type||'—','Size':fmtBytes(file.size),'Pixels':dim?dim.w+' × '+dim.h:'—'}}];
    ['ifd0','image','exif','interop','gps','ifd1','thumbnail','jfif','ihdr','iptc','xmp','icc'].forEach(function(k){ if(seg[k]&&typeof seg[k]==='object') rawGroups.push({seg:SEG[k]||k,kv:flatten(seg[k])}); });
    var total=rawGroups.reduce(function(a,g){return a+Object.keys(g.kv).length;},0);
    $('rawCount').textContent=total+' tags';
    renderRaw('');
  }
  function renderRaw(q){
    q=(q||'').toLowerCase(); var out='',shown=0;
    rawGroups.forEach(function(g,gi){ var r='',hits=0;
      Object.keys(g.kv).forEach(function(key){ var val=g.kv[key]; if(val==null)return; var s=String(val);
        if(q&&key.toLowerCase().indexOf(q)<0&&s.toLowerCase().indexOf(q)<0&&g.seg.toLowerCase().indexOf(q)<0)return;
        hits++; r+='<div class="kv"><span class="kk">'+esc(key)+'</span><span class="vv">'+esc(s)+'</span></div>'; });
      if(!hits)return; shown++;
      var closed=q?'':(gi>1?' closed':'');
      out+='<div class="grp'+closed+'"><button type="button"><span class="seg">'+esc(g.seg)+'</span><span class="n">'+hits+'</span><span class="chev">▾</span></button>'+r+'</div>';
    });
    $('rawBody').innerHTML = shown?out:'<div class="emptyc" style="padding:12px 0">No tags match “'+esc(q)+'”.</div>';
    Array.prototype.forEach.call($('rawBody').querySelectorAll('.grp > button'),function(b){ b.addEventListener('click',function(){ b.parentNode.classList.toggle('closed'); }); });
  }

  function buildJSON(file,dim,seg,gps,hasGPS){
    var o={file:{name:file.name,type:file.type,size:file.size},pixels:dim?{width:dim.w,height:dim.h}:null,metadata:{}};
    for(var k in seg){ if(seg[k]&&typeof seg[k]==='object') o.metadata[k]=flatten(seg[k]); }
    if(hasGPS) o.gps={latitude:gps.latitude,longitude:gps.longitude};
    return JSON.stringify(o,null,2);
  }

  /* ---- sanitize: redraw via canvas (drops EXIF/GPS/IPTC/XMP), bake orientation,
     then strip the color-profile / comment markers the encoder re-adds, so the
     output carries no metadata at all. ---- */
  function concat(parts){ var t=0,i; for(i=0;i<parts.length;i++)t+=parts[i].length; var o=new Uint8Array(t),off=0; for(i=0;i<parts.length;i++){o.set(parts[i],off);off+=parts[i].length;} return o; }
  function stripJpeg(b){
    if (b[0]!==0xFF||b[1]!==0xD8) return b;
    var parts=[b.subarray(0,2)], i=2;
    while (i<b.length){
      if (b[i]!==0xFF){ i++; continue; }
      var m=b[i+1];
      if (m===0xD9){ parts.push(b.subarray(i,i+2)); break; }
      if (m===0xDA){ parts.push(b.subarray(i)); break; }           // scan data → EOI, verbatim
      var len=(b[i+2]<<8)|b[i+3];
      var drop=(m>=0xE1 && m<=0xEF) || m===0xFE;                   // APP1..APP15 (EXIF/XMP/ICC/Photoshop) + COM; keep APP0 (JFIF)
      if (!drop) parts.push(b.subarray(i,i+2+len));
      i += 2+len;
    }
    return concat(parts);
  }
  function stripPng(b){
    var sig=[137,80,78,71,13,10,26,10],k;
    for (k=0;k<8;k++) if (b[k]!==sig[k]) return b;
    var KEEP={IHDR:1,PLTE:1,IDAT:1,IEND:1,tRNS:1}, parts=[b.subarray(0,8)], i=8;
    while (i+8<=b.length){
      var len=((b[i]<<24)|(b[i+1]<<16)|(b[i+2]<<8)|b[i+3])>>>0;
      var type=String.fromCharCode(b[i+4],b[i+5],b[i+6],b[i+7]);
      var end=i+12+len;
      if (KEEP[type]) parts.push(b.subarray(i,end));
      if (type==='IEND') break;
      i=end;
    }
    return concat(parts);
  }
  async function sanitizeBlob(file){
    var bmp;
    try { bmp = await createImageBitmap(file,{imageOrientation:'from-image'}); }
    catch(e){ bmp = await createImageBitmap(file); }
    var c=document.createElement('canvas'); c.width=bmp.width; c.height=bmp.height;
    c.getContext('2d').drawImage(bmp,0,0); if(bmp.close)bmp.close();
    var isPng=/png/i.test(file.type||'')||/\.png$/i.test(file.name||'');
    var type=isPng?'image/png':'image/jpeg';
    var blob=await new Promise(function(res){ c.toBlob(res,type,isPng?undefined:0.95); });
    var bytes=new Uint8Array(await blob.arrayBuffer());
    var clean=isPng?stripPng(bytes):stripJpeg(bytes);
    return { blob:new Blob([clean],{type:type}), ext: isPng?'png':'jpg' };
  }
  function cleanName(name, ext){ var base=(name||'image').replace(/\.[^.]+$/,''); return base+'_clean.'+ext; }

  async function saveClean(){
    if (!currentFile) return;
    var btn=$('saveBtn'); btn.disabled=true;
    try {
      var r = await sanitizeBlob(currentFile);
      if (!r.blob) throw new Error('encode');
      var fname = cleanName(currentFile.name, r.ext);
      // iOS / Android: hand the clean image to the native share sheet (Save Image to Photos).
      if (navigator.canShare){
        try {
          var sf = new File([r.blob], fname, { type: r.blob.type });
          if (navigator.canShare({ files:[sf] })){ await navigator.share({ files:[sf] }); toast('Clean copy ready ✓'); return; }
        } catch(e){ if (e && e.name==='AbortError') return; /* else fall through to download */ }
      }
      // Desktop / fallback: trigger a normal download of the clean copy.
      var url = URL.createObjectURL(r.blob);
      var a = document.createElement('a'); a.href=url; a.download=fname;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ a.remove(); URL.revokeObjectURL(url); }, 1500);
      toast('Saved a clean copy ✓');
    } catch(err){
      toast('Couldn’t save the clean copy.');
    } finally { btn.disabled=false; }
  }

  function copyJSON(){
    if (!currentJSON) return;
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(currentJSON).then(function(){toast('Metadata JSON copied ✓');},function(){toast('Press & hold to copy.');});
    else toast('Clipboard unavailable here.');
  }
  function reset(){ $('results').hidden=true; $('bar').hidden=true; $('intro').hidden=false; currentFile=null; currentJSON=null; $('file').value=''; try{window.scrollTo(0,0);}catch(e){} }

  /* wiring */
  var fileInput=$('file');
  $('pick').addEventListener('click', function(){ fileInput.click(); });
  fileInput.addEventListener('change', function(){ if(fileInput.files[0]) handle(fileInput.files[0]); });
  var pickEl=$('pick');
  ['dragenter','dragover'].forEach(function(ev){ pickEl.addEventListener(ev,function(e){e.preventDefault();pickEl.classList.add('over');}); });
  ['dragleave','drop'].forEach(function(ev){ pickEl.addEventListener(ev,function(e){e.preventDefault();if(ev!=='drop')pickEl.classList.remove('over');}); });
  pickEl.addEventListener('drop', function(e){ pickEl.classList.remove('over'); var f=e.dataTransfer.files[0]; if(f) handle(f); });
  window.addEventListener('dragover', function(e){ e.preventDefault(); });
  window.addEventListener('drop', function(e){ e.preventDefault(); if(e.target.closest&&e.target.closest('#pick'))return; var f=e.dataTransfer&&e.dataTransfer.files[0]; if(f) handle(f); });
  window.addEventListener('paste', function(e){ var f=e.clipboardData&&e.clipboardData.files&&e.clipboardData.files[0]; if(f) handle(f); });
  $('saveBtn').addEventListener('click', saveClean);
  $('jsonBtn').addEventListener('click', copyJSON);
  $('newBtn').addEventListener('click', reset);
  $('search').addEventListener('input', function(){ renderRaw(this.value); });
  // keep the filter box tap from toggling the <details>
  $('search').addEventListener('click', function(e){ e.stopPropagation(); });

  if (typeof exifr === 'undefined') toast('Metadata library failed to load — check your connection.');
})();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>

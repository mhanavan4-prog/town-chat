<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboards — Thornreach</title>
<!--OG-->
<meta name="theme-color" content="#140f2b">
<link rel="icon" href="/icon-192.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#130c22;--bg1:#0b0716;--bg2:#060410;--ink:#e9ddff;--mut:#a99bc4;--mut2:#8d80a8;
    --violet:#b98aff;--teal:#7ef0c3;--green:#9ee37d;--gold:#e8d9a8;
    --card:rgba(16,10,26,0.72);--line:rgba(185,138,255,0.18);--grad:linear-gradient(90deg,#a678f0,#5ee7c0);
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);font-family:'Segoe UI',system-ui,Arial,sans-serif;line-height:1.55;min-height:100vh;
    background:radial-gradient(1100px 620px at 78% -5%,rgba(146,109,222,0.18),transparent 55%),radial-gradient(820px 520px at 6% 12%,rgba(94,231,192,0.07),transparent 60%),linear-gradient(180deg,var(--bg0) 0%,var(--bg1) 45%,var(--bg2) 100%);background-attachment:fixed}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1060px;margin:0 auto;padding:0 20px}
  .wordmark{font-family:'Cinzel Decorative','Cinzel',Georgia,serif;letter-spacing:3px;font-weight:900}
  .grad-text{background:linear-gradient(90deg,#c9a7ff 0%,#8de8c8 55%,#e8d9a8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{display:inline-block;font-weight:800;letter-spacing:.4px;cursor:pointer;border:none;border-radius:10px;padding:9px 16px;color:#0b0713;background:var(--grad);box-shadow:0 6px 22px rgba(130,90,230,0.32);transition:transform .14s ease;font-size:13px}
  .btn:hover{transform:translateY(-2px)}
  .btn.ghost{background:rgba(10,6,20,0.5);color:var(--ink);border:1px solid var(--line);box-shadow:none}
  header.nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(10px);background:linear-gradient(180deg,rgba(11,7,22,0.86),rgba(11,7,22,0.55));border-bottom:1px solid rgba(185,138,255,0.12)}
  .nav .wrap{display:flex;align-items:center;gap:14px;height:62px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .sigil{width:28px;height:28px}
  .brand .name{font-size:18px}
  .nav .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  .nav .right a.link{color:var(--mut);font-size:14px}
  .nav .right a.link:hover{color:var(--ink)}

  .head{text-align:center;padding:40px 0 10px}
  .head h1{font-family:'Cinzel Decorative','Cinzel',serif;font-weight:900;font-size:clamp(30px,6vw,52px);letter-spacing:4px;margin:0 0 6px}
  .head p{color:var(--mut);font-family:Georgia,serif;font-style:italic;margin:0}
  .week{color:var(--mut2);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-top:10px}

  .boards{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:26px 0 70px}
  @media(max-width:760px){ .boards{grid-template-columns:1fr} }
  .board{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 10px;overflow:hidden}
  .board h2{display:flex;align-items:center;gap:10px;font-family:'Cinzel',serif;font-weight:600;font-size:18px;margin:0 0 12px;letter-spacing:0.5px}
  .board h2 .bi{font-size:22px}
  .row{display:flex;align-items:center;gap:12px;padding:9px 6px;border-bottom:1px solid rgba(185,138,255,0.09);border-radius:8px}
  .row:last-child{border-bottom:none}
  .row:hover{background:rgba(140,90,255,0.07)}
  .row .pos{width:34px;text-align:center;font-family:'Cinzel',serif;font-weight:700;font-size:16px;color:var(--mut)}
  .row.top1 .pos,.row.top2 .pos,.row.top3 .pos{font-size:19px}
  .row .nm{flex:1;font-weight:700;color:#f1e9ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .nm:hover{color:var(--teal)}
  .row.me{border:1px solid rgba(185,138,255,0.5);background:rgba(140,90,255,0.12)}
  .row .val{font-family:'Cinzel',serif;font-weight:700;color:var(--gold);font-size:15px}
  .empty{color:var(--mut2);font-size:13px;font-style:italic;padding:14px 6px}
  .loading{text-align:center;color:var(--mut2);padding:60px 0}
  /* Mobile: the nav is one wide no-wrap row (brand + search + links). Let it
     wrap so every item stays reachable instead of forcing the page sideways,
     and hard-stop any horizontal page scroll. */
  html{overflow-x:hidden}
  body{overflow-x:hidden;max-width:100vw}
  @media(max-width:720px){
    .nav .wrap{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:10px;gap:8px;justify-content:center}
    .nav .right{margin-left:0;flex-wrap:wrap;justify-content:center;width:100%;gap:8px}
    #siteSearch{order:-1;flex-basis:100%;display:flex;justify-content:center}
    .nav .right .btn,.nav .right .link,.nav .link{font-size:12.5px;padding:7px 11px}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="jsg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b98aff"/><stop offset="1" stop-color="#7ef0c3"/></linearGradient>
</defs></svg>

<header class="nav">
  <div class="wrap">
    <a class="brand" href="/">
      <svg class="sigil" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="44" fill="none" stroke="url(#jsg)" stroke-width="4"/>
        <path d="M50 6 L75.86 85.6 L8.15 36.4 L91.85 36.4 L24.14 85.6 Z" fill="none" stroke="url(#jsg)" stroke-width="4" stroke-linejoin="round"/>
      </svg>
      <span class="wordmark name grad-text">THORNREACH</span>
    </a>
    <div class="right">
      <div id="siteSearch"></div>
      <a class="link" href="/covens">Covens</a>
      <a class="link" href="/profile">My profile</a>
      <a class="btn ghost" href="/play">Enter the Town</a>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <h1 class="grad-text">LEADERBOARDS</h1>
    <p>Who holds the longest night. Boards reset every week.</p>
    <div class="week" id="week"></div>
  </div>
  <div class="loading" id="loading">Summoning the standings…</div>
  <div class="boards" id="boards" style="display:none"></div>
</main>

<script>
(function(){
  "use strict";
  function esc(s){ return String(s).replace(/[<>&"]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]; }); }
  function medal(r){ return r===1?'🥇':r===2?'🥈':r===3?'🥉':r; }
  function icon(id){ return id==='hunt'?'🌙':id==='boss'?'💀':id==='delve'?'⛏️':id==='tourney'?'⚔️':'•'; }
  // highlight the viewer's own rows if they're logged in
  var myName=null; try{ var a=JSON.parse(localStorage.getItem('tc_account')||'null'); if(a&&a.username) myName=a.username.toLowerCase(); }catch(e){}

  fetch('/api/leaderboards').then(function(r){ return r.json(); }).then(function(d){
    document.getElementById('loading').style.display='none';
    var box=document.getElementById('boards'); box.style.display='grid';
    document.getElementById('week').textContent = 'Week '+String(d.week||'').replace(/^w/,'');
    box.innerHTML = (d.boards||[]).map(function(b){
      var rows = (b.top&&b.top.length) ? b.top.map(function(e){
        var me = myName && e.name && e.name.toLowerCase()===myName;
        var cls = 'row'+(e.rank<=3?(' top'+e.rank):'')+(me?' me':'');
        return '<div class="'+cls+'"><div class="pos">'+medal(e.rank)+'</div>'+
          '<a class="nm" href="/u/'+encodeURIComponent(e.name)+'">'+esc(e.name)+'</a>'+
          '<div class="val">'+Number(e.value||0).toLocaleString()+'</div></div>';
      }).join('') : '<div class="empty">No standings yet this week — be the first.</div>';
      return '<div class="board"><h2><span class="bi">'+icon(b.id)+'</span>'+esc(b.label)+'</h2>'+rows+'</div>';
    }).join('');
  }).catch(function(){
    document.getElementById('loading').textContent='Could not load the leaderboards right now.';
  });
})();
</script>
<footer style="border-top:1px solid rgba(185,138,255,0.12);margin-top:50px;padding:24px 0"><div class="wrap" style="display:flex;gap:18px;flex-wrap:wrap;align-items:center;color:#8d80a8;font-size:12.5px"><span>© 2026 Thornreach</span><a href="/privacy" style="color:#a99bc4;margin-left:auto">Privacy</a><a href="/terms" style="color:#a99bc4">Terms</a><a href="/" style="color:#a99bc4">Home</a></div></footer>
<script src="/site-search.js" defer></script>
<script src="/presence.js" defer></script>
</body>
</html>
